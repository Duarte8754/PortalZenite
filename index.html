<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Portal Zênite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<!-- HOME -->
<div id="home" class="page active">
  <h1 id="typing"></h1>
  <p>Conectado hoje. Preparado para amanhã.</p>
  <button onclick="mostrarPagina('inscricao')">Inscrição</button>
  <button onclick="mostrarPagina('login')">Login</button>
</div>

<!-- INSCRIÇÃO -->
<div id="inscricao" class="page">
  <h2>Formulário de Inscrição</h2>

  <form id="formInscricao">
    <input id="nome" placeholder="Nome completo" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="telefone" placeholder="Telefone" required>
    <input id="whatsapp" placeholder="WhatsApp" required>
    <input id="paiMae" placeholder="Pai / Mãe" required>

    <label>Classe</label>
    <select id="classe" required>
      <option disabled>7ª classe (indisponível)</option>
      <option disabled>8ª classe (indisponível)</option>
      <option>9ª Classe</option>
      <option>10ª Classe</option>
      <option>11ª Classe</option>
      <option>12ª Classe</option>
    </select>

    <label>Data de nascimento</label>
    <input id="nascimento" type="date" required>

    <h4>Disciplinas</h4>
    <label><input type="checkbox" value="Matemática"> Matemática</label>
    <label><input type="checkbox" value="Português"> Português</label>
    <label><input type="checkbox" value="Física"> Física</label>
    <label><input type="checkbox" value="Química"> Química</label>

    <button type="submit">Enviar</button>
  </form>

  <button onclick="mostrarPagina('home')">Voltar</button>
</div>

<!-- LOGIN -->
<div id="login" class="page">
  <h2>Login</h2>
  <form id="formLogin">
    <input id="loginUsuario" placeholder="Email ou Número">
    <input id="loginSenha" type="password" placeholder="Senha">
    <button type="submit">Entrar</button>
  </form>
  <button onclick="mostrarPagina('home')">Voltar</button>
</div>

<!-- PAINEL ALUNO -->
<div id="painelAluno" class="page">
  <h2>Painel do Aluno</h2>

  <div class="abas">
    <button onclick="mostrarAba('perfil')">Perfil</button>
    <button onclick="mostrarAba('notas')">Notas</button>
    <button onclick="mostrarAba('pagamento')">Pagamento</button>
    <button onclick="mostrarAba('extrato')">Extrato</button>
    <button onclick="mostrarAba('calendario')">Calendário</button>
    <button onclick="mostrarAba('divida')">Saldo</button>
    <button onclick="mostrarAba('historico')">Histórico</button>
    <button onclick="logout()">Sair</button>
  </div>

  <div id="perfil" class="aba"></div>
  <div id="notas" class="aba"></div>
  <div id="pagamento" class="aba"></div>
  <div id="extrato" class="aba"></div>
  <div id="calendario" class="aba"></div>
  <div id="divida" class="aba"></div>
  <div id="historico" class="aba"></div>
</div>

<!-- PAINEL ADMIN -->
<div id="painelAdmin" class="page">
  <h2>Administrador</h2>

  <table id="tabelaAlunos"></table>

  <h3>Lançar Nota</h3>
  <input id="notaAluno" placeholder="Número do aluno">
  <select id="notaDisciplina"></select>
  <input id="notaValor" type="number" min="0" max="20">
  <select id="notaTrimestre">
    <option value="1">1º Trimestre</option>
    <option value="2">2º Trimestre</option>
    <option value="3">3º Trimestre</option>
  </select>
  <button onclick="salvarNota()">Salvar Nota</button>

  <button onclick="logout()">Sair</button>
</div>

<script src="script.js"></script>
</body>
  </html>
