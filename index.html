<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Zênite</title>

<link rel="stylesheet" href="style.css">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div class="container">

<!-- HOME -->
<div id="home" class="page active">
  <h1 class="animated-title">
    <span id="title-text"></span><span class="cursor">|</span>
  </h1>

  <h2>Conectado hoje. Preparado para amanhã.</h2>

  <button onclick="mostrarInscricao()">Inscrição</button>
  <button onclick="mostrarLogin()">Login</button>
</div>

<!-- INSCRIÇÃO -->
<div id="inscricao" class="page">
<form id="formInscricao">
  <input id="nome" placeholder="Nome completo" required>
  <input id="email" type="email" placeholder="Email" required>
  <input id="telefone" placeholder="Telefone" required>
  <input id="whatsapp" placeholder="WhatsApp" required>
  <input id="paiMae" placeholder="Pai/Mãe" required>
  <input id="classe" placeholder="Classe" required>
  <input id="nascimento" type="date" required>

  <label><input type="checkbox" name="disciplinas" value="Matemática"> Matemática</label>
  <label><input type="checkbox" name="disciplinas" value="Português"> Português</label>

  <button type="submit">Enviar</button>
</form>
<button onclick="voltarHome()">Voltar</button>
</div>

<!-- LOGIN -->
<div id="login" class="page">
<form id="formLogin">
  <input id="loginUsuario" placeholder="Email ou Número">
  <input id="loginSenha" type="password" placeholder="Senha">
  <button type="submit">Entrar</button>
</form>
<button onclick="voltarHome()">Voltar</button>
</div>

<!-- PAINEL ALUNO -->
<div id="painelAluno" class="page">
<h2>Painel do Aluno</h2>

<div class="abas">
  <button onclick="mostrarAba('abaPerfil')">Perfil</button>
  <button onclick="mostrarAba('abaNotas')">Notas</button>
  <button onclick="mostrarAba('abaPagamento')">Pagamento</button>
</div>

<div id="abaPerfil" class="aba"></div>
<div id="abaNotas" class="aba"></div>
<div id="abaPagamento" class="aba"></div>

<button onclick="logout()">Sair</button>
</div>

<!-- PAINEL ADMIN -->
<div id="painelAdmin" class="page">
<h2>Administrador</h2>
<table id="tabelaAlunos"></table>
<button onclick="logout()">Sair</button>
</div>

</div>

<script src="script.js"></script>
</body>
  </html>
